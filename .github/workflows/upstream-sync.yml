# Daily check for new commits on derailed/k9s@master. When upstream has moved
# ahead of main, the tip of upstream/master is force-pushed to an
# `upstream-sync` branch and a pull request against main is opened (or
# refreshed). The PR is always created: GitHub computes mergeability, so
# clean syncs merge as-is and conflicted syncs show the standard
# "resolve conflicts" banner for manual resolution.
#
# NOTE: scheduled workflows only run from the default branch; merge this file
# into main (or cherry-pick it) for the cron trigger to take effect.

name: Upstream sync (k9s)

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  upstream-sync:
    name: Check upstream/master and open sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # force-push the upstream-sync branch
      pull-requests: write # open or refresh the sync PR
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream/master
        run: |
          git config user.name "k9ish-upstream-sync[bot]"
          git config user.email "k9ish-upstream-sync[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/derailed/k9s.git
          git fetch upstream master --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          count="$(git rev-list --count main..upstream/master)"
          head="$(git rev-parse --short upstream/master)"
          {
            echo "count=$count"
            echo "head=$head"
          } >>"$GITHUB_OUTPUT"
          echo "upstream/master is $count commits ahead of main (head $head)"

      - name: Push branch and open sync PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
          UPSTREAM_HEAD: ${{ steps.check.outputs.head }}
        run: |
          gh auth setup-git
          git push --force origin upstream/master:refs/heads/upstream-sync
          title="Sync upstream/master@${UPSTREAM_HEAD}"
          {
            echo "Brings \`derailed/k9s@master\` \`${UPSTREAM_HEAD}\` (\`${UPSTREAM_COUNT}\` new commits since the last sync) into this fork."
            echo
            echo "Automated branch: always the tip of upstream/master, force-updated on every sync run."
          } >pr-body.md
          gh pr create --base main --head upstream-sync --title "$title" --body-file pr-body.md ||
            gh pr edit upstream-sync --title "$title" --body-file pr-body.md

      - name: Nothing to do
        if: steps.check.outputs.count == '0'
        run: echo "No new upstream commits; main is up to date."
