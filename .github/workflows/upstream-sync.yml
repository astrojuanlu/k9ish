# Daily check for new commits on derailed/k9s@master. When upstream has moved
# ahead of main, an `upstream-sync` branch is force-updated to the tip of
# upstream/master plus a commit that restores the fork's own
# .github/workflows, and a pull request against main is opened (or
# refreshed). The PR is always created: GitHub computes mergeability, so
# clean syncs merge as-is and conflicted syncs show the standard
# "resolve conflicts" banner for manual resolution.
#
# The workflow reset exists because the default GITHUB_TOKEN is a GitHub App
# that is never allowed to create or update workflow files, so upstream's CI
# definitions cannot be pushed with it — and keeping the fork's own
# definitions on the branch also stops upstream CI from entering the fork.
#
# NOTE: scheduled workflows only run from the default branch; merge this file
# into main (or cherry-pick it) for the cron trigger to take effect.

name: Upstream sync (k9s)

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  upstream-sync:
    name: Check upstream/master and open sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # force-push the upstream-sync branch
      pull-requests: write # open or refresh the sync PR
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream/master
        run: |
          git config user.name "k9ish-upstream-sync[bot]"
          git config user.email "k9ish-upstream-sync[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/derailed/k9s.git
          git fetch upstream master --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          count="$(git rev-list --count main..upstream/master)"
          head="$(git rev-parse --short upstream/master)"
          {
            echo "count=$count"
            echo "head=$head"
          } >>"$GITHUB_OUTPUT"
          echo "upstream/master is $count commits ahead of main (head $head)"

      - name: Push branch and open sync PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
          UPSTREAM_HEAD: ${{ steps.check.outputs.head }}
        run: |
          # If this push is ever rejected for touching workflow files (e.g.
          # after changing the fork's own workflows on main), reseed the branch
          # once with user credentials and the bot takes over again:
          #   git switch -C upstream-sync upstream/master
          #   rm -rf .github/workflows && git checkout main -- .github/workflows
          #   git add -A .github/workflows
          #   git commit --allow-empty -m "chore(sync): keep fork workflows"
          #   git push --force origin upstream-sync
          git switch -C upstream-sync upstream/master
          rm -rf .github/workflows
          git checkout main -- .github/workflows
          git add -A .github/workflows
          git commit --allow-empty -m "chore(sync): keep fork workflows on the sync branch"
          gh auth setup-git
          git push --force origin upstream-sync:refs/heads/upstream-sync
          title="Sync upstream/master@${UPSTREAM_HEAD}"
          {
            echo "Brings \`derailed/k9s@master\` \`${UPSTREAM_HEAD}\` (\`${UPSTREAM_COUNT}\` new commits since the last sync) into this fork."
            echo
            echo "The \`upstream-sync\` branch is the tip of upstream/master plus a commit that keeps the fork's GitHub workflows in place; it is force-updated on every sync run."
          } >pr-body.md
          if gh pr view upstream-sync --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            gh pr edit upstream-sync --repo "$GITHUB_REPOSITORY" --title "$title" --body-file pr-body.md
          else
            # REST instead of `gh pr create`: the GraphQL createPullRequest
            # mutation is denied to GITHUB_TOKEN (a GitHub App) when the head
            # branch's history is not a descendant of the base branch, which
            # is the case here (the branch is upstream/master's tip).
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="$title" -f head=upstream-sync -f base=main \
              -f body="$(cat pr-body.md)" --jq .html_url
          fi

      - name: Nothing to do
        if: steps.check.outputs.count == '0'
        run: echo "No new upstream commits; main is up to date."
