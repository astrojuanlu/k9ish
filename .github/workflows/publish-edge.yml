# Build and release the k9ish snap to latest/edge, after tests pass on
# main. Triggered when the "K9s Test" workflow run on main completes;
# releases are serialized so that two pushes to main cannot race, or the
# edge channel could end up pointing at a revision we did not intend.

name: Release snap to edge

on:
  workflow_run:
    workflows: [ "K9s Test" ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: release-to-edge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Pack and release to latest/edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The job only packs and uploads to the store; it never pushes,
          # so the checked-out token does not need to outlive the step.
          persist-credentials: false

      - name: Pack the snap
        id: pack
        uses: canonical/craft-actions/snapcraft/pack@d2add174925f9bca7b0a826010c8e1ce2a4bbc3d # v1

      - name: Upload and release to latest/edge
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAPS: ${{ steps.pack.outputs.snaps }}
        run: |
          set -euo pipefail
          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic
          for snap_file in $SNAPS; do
            snapcraft upload "$snap_file" --release=latest/edge
          done
