name: k9ish
base: core26
adopt-info: k9ish
summary: A fork of k9s tuned for strict-confinement snap distribution
description: |
  k9ish is a fork of K9s — the same terminal UI to browse and manage
  Kubernetes clusters, modified so it can be packaged and distributed as a
  strict-confinement snap and to talk to clusters exclusively through the
  Kubernetes API (no bundled kubectl).

  Compared to K9s, resource/manifest editing, `kubectl cp` file transfers,
  apply/delete of local manifests from the :dir view, plugins and native
  clipboard helpers are not available.

grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  armhf:
    build-on: [armhf]
    build-for: [armhf]

apps:
  k9ish:
    command: bin/k9ish
    completer: k9ish-completion.bash
    plugs: [network, network-bind, dot-kube]

plugs:
  dot-kube:
    interface: personal-files
    read:  [$HOME/.kube]
    write: [$HOME/.kube]

parts:
  k9ish:
    plugin: go
    source: .
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --long --tags --always --match=v*.*.* | sed 's/v//')
    override-build: |
      make test
      make build
      install -D "$SNAPCRAFT_PART_BUILD/execs/k9ish" "$SNAPCRAFT_PART_INSTALL/bin/k9ish"
      "$SNAPCRAFT_PART_INSTALL/bin/k9ish" completion bash > "$SNAPCRAFT_PART_INSTALL/k9ish-completion.bash"
    build-packages: [build-essential]
    build-snaps: [go]
